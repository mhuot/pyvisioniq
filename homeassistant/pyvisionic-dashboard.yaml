# PyVisionic — Home Assistant dashboard
#
# Core cards only; no custom-card dependencies. Paste into a new dashboard:
# Settings → Dashboards → Add dashboard → New dashboard from scratch → open it
# → ⋮ → Raw configuration editor → replace everything with this file.
#
# Entity ids assume discovery configs with default_entity_id (required on HA
# Core 2026.4+, where object_id no longer works). If entities show other ids,
# delete the "PyVisionic EV" device on the MQTT integration page once; it
# rediscovers with sensor.pyvisionic_* ids within seconds.

views:
  - title: EV
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: binary_sensor.pyvisionic_is_charging
        visibility:
          - condition: state
            entity: binary_sensor.pyvisionic_is_charging
            state: "on"
      - type: entity
        entity: sensor.pyvisionic_trip_readiness
        visibility:
          - condition: state
            entity: sensor.pyvisionic_trip_readiness
            state: off_track
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:car-electric
          - type: gauge
            entity: sensor.pyvisionic_battery_level
            name: Battery
            min: 0
            max: 100
            severity:
              green: 45
              yellow: 20
              red: 0
            grid_options:
              columns: 6
              rows: 3
          - type: gauge
            entity: sensor.pyvisionic_twelve_v
            name: 12V
            min: 0
            max: 100
            severity:
              green: 60
              yellow: 50
              red: 0
            grid_options:
              columns: 6
              rows: 3
          - type: tile
            entity: sensor.pyvisionic_range_km
            name: Range (car's guess)
            icon: mdi:map-marker-distance
          - type: tile
            entity: sensor.pyvisionic_est_range_full
            name: Full-charge range (measured)
            icon: mdi:map-marker-radius
          # Open-Meteo read by HA every 15 min, not the car's last poll, so this
          # stays current while the collector is idle. sensor.pyvisionic_temperature
          # is the same measurement as recorded against the driving data.
          - type: tile
            entity: sensor.outside_temperature
            name: Outside
          - type: tile
            entity: sensor.outside_conditions
            name: Conditions
          - type: tile
            entity: binary_sensor.pyvisionic_doors_unlocked
            name: Doors
          - type: tile
            entity: binary_sensor.pyvisionic_plugged_in
            name: Charge cable
          - type: tile
            entity: binary_sensor.pyvisionic_tire_warning
            name: Tires
            visibility:
              - condition: state
                entity: binary_sensor.pyvisionic_tire_warning
                state: "on"
          - type: tile
            entity: binary_sensor.pyvisionic_opening_open
            name: Something open
            color: amber
            visibility:
              - condition: state
                entity: binary_sensor.pyvisionic_opening_open
                state: "on"
          - type: tile
            entity: binary_sensor.pyvisionic_climate_on
            name: Climate running
            color: cyan
            visibility:
              - condition: state
                entity: binary_sensor.pyvisionic_climate_on
                state: "on"
          - type: tile
            entity: binary_sensor.pyvisionic_vehicle_warning
            name: Service warnings
            color: red
            visibility:
              - condition: state
                entity: binary_sensor.pyvisionic_vehicle_warning
                state: "on"

      - type: grid
        cards:
          - type: heading
            heading: Where it is
            icon: mdi:map
          - type: map
            entities:
              - entity: device_tracker.pyvisionic_location
            theme_mode: auto
            grid_options:
              columns: 12
              rows: 4

      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.pyvisionic_is_charging
            state: "on"
        cards:
          - type: heading
            heading: Charging
            icon: mdi:ev-station
          - type: tile
            entity: sensor.pyvisionic_charging_power
            name: Power now
            color: green
          - type: tile
            entity: sensor.pyvisionic_charge_time_remaining
            name: Time to charge limit
            color: green
          - type: history-graph
            hours_to_show: 12
            entities:
              - entity: sensor.pyvisionic_charging_power
                name: kW
              - entity: sensor.pyvisionic_battery_level
                name: SOC

      - type: grid
        cards:
          - type: heading
            heading: Trip readiness
            icon: mdi:routes-clock
          - type: markdown
            content: >-
              {% set s = states('sensor.pyvisionic_trip_readiness') %}
              {% set trip = state_attr('sensor.pyvisionic_trip_readiness', 'trip') %}
              {% set dep = state_attr('sensor.pyvisionic_trip_readiness', 'departure') %}
              {% set duty = state_attr('sensor.pyvisionic_trip_readiness', 'duty_cycle_pct') %}
              {% set hrs = state_attr('sensor.pyvisionic_trip_readiness', 'plugged_hours_needed') %}
              {% if s == 'on_track' %}## ✅ On track
              {% elif s == 'tight' %}## ⚠️ Tight
              {% elif s == 'off_track' %}## 🔴 Off track
              {% elif s == 'no_plan' or s == 'idle' %}## 💤 No trip planned
              {% else %}## ❔ {{ s }}
              {% endif %}
              {% if trip and s in ['on_track','tight','off_track'] %}
              **{{ trip }}** — departs {{ dep }}

              Needs **{{ hrs }} h plugged**
              ({{ (duty or 0) | round(0) }}% of the time remaining)
              {% endif %}
          - type: markdown
            visibility:
              - condition: state
                entity: sensor.pyvisionic_trip_readiness
                state: off_track
            content: >-
              #### 🔌 Plug in now or plan a DC fast charge —
              the current pace does not reach this departure.

      - type: grid
        cards:
          - type: heading
            heading: Outside
            icon: mdi:weather-partly-cloudy
          - type: tile
            entity: sensor.outside_feels_like
            name: Feels like
          - type: tile
            entity: sensor.outside_humidity
            name: Humidity
          - type: tile
            entity: sensor.outside_wind_speed
            name: Wind
          - type: markdown
            content: >-
              {% set now = states('sensor.outside_temperature') | float(none) %}
              {% set car = states('sensor.pyvisionic_temperature') | float(none) %}
              {% if now is not none and car is not none %}
              Cold weather is the largest single drag on range, so this is the
              number the efficiency charts are plotted against.
              {% if (now - car) | abs >= 3 %}

              *The car's last recorded reading was
              {{ car | round(0) }}°, {{ (now - car) | abs | round(0) }}°
              {{ 'colder' if car < now else 'warmer' }} than now — it dates from
              the last poll, not this minute.*
              {% endif %}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Battery week
            icon: mdi:battery-charging-60
          # Separate panels, not a shared axis: SOC and temperature have no
          # common scale, and overlaying them would invent a correlation the
          # reader has not earned.
          - type: history-graph
            hours_to_show: 168
            entities:
              - entity: sensor.pyvisionic_battery_level
                name: SOC
              - entity: sensor.outside_temperature
                name: Outside
            grid_options:
              columns: 12
              rows: 5

      - type: grid
        cards:
          - type: heading
            heading: Charging economics
            icon: mdi:transmission-tower
          - type: gauge
            entity: sensor.pyvisionic_charge_efficiency
            name: Wall → battery
            min: 40
            max: 100
            severity:
              green: 80
              yellow: 60
              red: 40
            grid_options:
              columns: 6
              rows: 3
          - type: markdown
            grid_options:
              columns: 6
              rows: 3
            content: >-
              {% set e = states('sensor.pyvisionic_charge_efficiency') | float(0) %}
              {% if e > 0 %}
              Of every **10 kWh** billed at the wall,
              **{{ (e / 10) | round(1) }} kWh** reaches the pack.

              *30-day energy-weighted measurement.*
              {% else %} *No measured sessions yet.* {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Data pipeline
            icon: mdi:database-sync
          - type: tile
            entity: binary_sensor.pyvisionic_data_fresh
            name: Vehicle data
          - type: tile
            entity: sensor.pyvisionic_call_class
            name: Last fetch
          - type: tile
            entity: sensor.pyvisionic_forces_today
            name: Car wakeups today
          - type: tile
            entity: sensor.pyvisionic_odometer_km
            name: Odometer
